<!doctype html>
<html>
  <head>
    <title><%= productName %></title>

    <meta charset="utf-8" />
    <meta name="description" content="<%= productDescription %>" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta
      name="viewport"
      content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width<% if (ctx.mode.cordova || ctx.mode.capacitor) { %>, viewport-fit=cover<% } %>"
    />
    <!-- <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';<% if (ctx.dev) { %> connect-src 'self' ws://localhost:*; worker-src 'self' blob:;<% } %>" /> -->
    <!-- <meta
      http-equiv="Content-Security-Policy"
      content="
      default-src 'self';
      script-src 'self' 'unsafe-eval';
      style-src 'self' 'unsafe-inline';
      img-src 'self' data: blob:
        https://tile.openstreetmap.org
        https://*.basemaps.cartocdn.com;
      <% if (ctx.dev) { %>
        connect-src 'self' ws://localhost:*;
        worker-src 'self' blob:;
      <% } %>
    "
    /> -->
    <style>
      :root.theme--light {
        background-color: #fff !important;
        color: #121212;
      }

      :root.theme--dark {
        background-color: #121212 !important;
        color: #fff;
      }
    </style>
    <script>
      (function () {
        const savedTheme =
          localStorage.getItem("vueuse-color-scheme") || "auto";
        const prefersDark = window.matchMedia(
          "(prefers-color-scheme: dark)",
        ).matches;
        const isDark =
          savedTheme === "dark" || (savedTheme === "auto" && prefersDark);

        // Always apply a class immediately — prevents any flash in either mode
        document.documentElement.classList.add(
          isDark ? "theme--dark" : "theme--light",
        );
      })();
    </script>

    <link
      rel="icon"
      type="image/png"
      sizes="128x128"
      href="icons/favicon-128x128.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="96x96"
      href="icons/favicon-96x96.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="icons/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="icons/favicon-16x16.png"
    />
    <link rel="icon" type="image/ico" href="favicon.ico" />
  </head>

  <body>
    <!-- quasar:entry-point -->
  </body>
</html>
